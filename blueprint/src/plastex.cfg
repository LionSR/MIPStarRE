[general]
renderer=HTML5
copy-theme-extras=yes
plugins=plastexdepgraph  plastexshowmore  leanblueprint
; texra_blueprint is disabled until every workflow that runs
; `leanblueprint web` can install the plugin. plasTeX imports every listed
; plugin on each \usepackage (plasTeX/Context.py: loadPythonPackage), so a
; missing texra_blueprint module makes every package load fail with
; "No module named 'texra_blueprint'" and the render reports unresolved
; labels. Re-enable together with the pr-ci install; see PR #2640.

[document]
toc-depth=3
toc-non-files=True

[files]
directory=../web/
split-level=0

[html5]
localtoc-level=0
extra-css=extra_styles.css
mathjax-dollars=False
