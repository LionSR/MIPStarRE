# Configuration for the shared texra-blueprint tooling.
# https://github.com/LionSR/texra-blueprint

[paper_gaps]
dir         = "docs/paper-gaps"
site_base   = "https://sirui-lu.com/MIPStarRE"
blob_base   = "https://github.com/LionSR/MIPStarRE/blob/main/docs/paper-gaps"
bib_author  = "The {MIPStarRE} contributors"
institution = "MIPStarRE"
title       = "MIPStarRE paper-gap notes"
scan_roots  = ["MIPStarRE", "blueprint/src", "docs"]
skip        = ["command.tex", "template.tex", "proof-gap-protocol.tex"]

# The source-key registry. The shared tool reads the key as everything before
# the first underscore of a note's file name; the notes here predate the
# platform's `<key>_<topic>.tex` convention and use hyphenated issue-anchored
# names, so each full note stem is registered as-is. All notes audit the one
# source paper of this project, arXiv:2009.12982 (quantum soundness of the
# classical low individual degree test), or the formal development itself.
# Enforced by `texra-blueprint paper-gaps check`.
[paper_gaps.sources]
issue-1032-orthonormalization-constant = "arXiv:2009.12982 (constant in the completion-route orthonormalization theorem)"
issue-1093-submeasurement-triangle-total-overlap = "arXiv:2009.12982 (total-overlap term in projective point-consistency transport)"
issue-1099-line169-triangle-sub-loss = "arXiv:2009.12982 (line-169 replacement step in the main-induction projectivization chain)"
issue-1099-sharper-local-fix = "arXiv:2009.12982 (sharper local repair for the line-169 transport step)"
issue-1100-projective-non-measurement-endpoints = "arXiv:2009.12982 (endpoint branches in the projectivization proof)"
issue-1228-orthonormalization-svd-usage = "arXiv:2009.12982 (SVD step in orthonormalization)"
issue-1230-self-improvement-sdp-usage = "arXiv:2009.12982 (use of the self-improvement SDP)"
issue-1622-ld-pasting-degree-zero = "arXiv:2009.12982 (degree-zero branch of low-degree pasting)"
issue-196-sdp-weakening = "arXiv:2009.12982 (SDP primal constraint as a submeasurement constraint)"
issue-2338-ch3-same-space-specializations = "arXiv:2009.12982 (chapter-3 same-space specializations of two-space propositions)"
issue-422-main-formal-zero-k-boundary = "arXiv:2009.12982 (zero-sampling boundary in the main formal theorem)"
issue-458-foundation-layer = "internal foundation-layer formalization design audit"
