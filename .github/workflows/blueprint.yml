name: Blueprint

on:
  push:
    branches:
      - main
    paths:
      - 'blueprint/src/**'
      - 'home_page/**'
      - '.github/workflows/blueprint.yml'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/assemble-pages-site.sh'
      - 'scripts/fetch-latest-artifact.sh'
  workflow_dispatch:

# Rapid pushes only need the newest build. Actual Pages deployments are
# serialized by the reusable deployment workflow.
concurrency:
  group: blueprint-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Build blueprint site component
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Install system dependencies
        uses: texra-ai/lean-env-action/blueprint-system-deps@6a03d2aa517a2ee67f71be460210310b3d48d70e
        with:
          cache-suffix: pdf-v1
          extra-packages: texlive-xetex texlive-science latexmk

      - name: Install leanblueprint
        uses: texra-ai/lean-env-action/leanblueprint@6a03d2aa517a2ee67f71be460210310b3d48d70e

      - name: Build blueprint
        working-directory: blueprint
        run: |
          tmp_output_file="$(mktemp)"

          set +o pipefail
          {
            leanblueprint pdf
            pdf_status=$?
            if [ "$pdf_status" -ne 0 ]; then
              exit "$pdf_status"
            fi
            if [ ! -s print/print.pdf ]; then
              echo "::error::leanblueprint pdf produced no output"
              exit 1
            fi
            leanblueprint web
          } 2>&1 | tee "$tmp_output_file"
          cmd_status=${PIPESTATUS[0]}
          set -o pipefail

          if grep -q "^ERROR:" "$tmp_output_file"; then
            echo "::error::Blueprint has unresolved labels (see ERROR lines above)"
            exit 1
          fi
          if grep -q "WARNING: File not found:" "$tmp_output_file"; then
            echo "::error::Blueprint has missing files (see WARNING lines above)"
            exit 1
          fi
          if [ "$cmd_status" -ne 0 ]; then
            exit "$cmd_status"
          fi

      - name: Package blueprint component
        run: |
          mkdir -p site-blueprint
          cp -r blueprint/web site-blueprint/blueprint
          cp blueprint/print/print.pdf site-blueprint/blueprint.pdf

      # This action runs in Docker and can produce root-owned output. Keep it
      # after packaging so it only writes into the pre-created component tree.
      - name: Build homepage
        uses: actions/jekyll-build-pages@v1
        with:
          source: home_page
          destination: site-blueprint/homepage

      - name: Upload blueprint component
        uses: actions/upload-artifact@v4
        with:
          name: site-blueprint
          path: site-blueprint
          retention-days: 30

  deploy:
    name: Deploy Pages site
    needs: blueprint
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
